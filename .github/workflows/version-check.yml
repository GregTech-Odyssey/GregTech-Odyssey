name: Check GTO Version in Bug Reports

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  check-version:
    if: |
      github.event_name == 'issues' &&
      (github.event.action == 'opened' ||
      (github.event.action == 'edited' && github.event.changes.body))
    runs-on: ubuntu-latest
    steps:
      - name: Check Issue and Version
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            // 版本号格式：X.Y.Z(-字母开头的渠道名)?-6位十六进制，例如 0.5.6-beta-266d67
            const REQUIRED_VERSION_REGEX = /^[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z][A-Za-z0-9]*)?-[A-Fa-f0-9]{6}$/;
            const INVALID_FORMAT_LABEL = '格式无效 invalid format';
            const OUTDATED_LABEL = '版本过时 outdated version';
            const formattedVersionExamples = '`X.Y.Z-xxxxxx`, `X.Y.Z-渠道-xxxxxx`（例如 / e.g. `0.5.6-beta-266d67`）';

            // 检查是否有错误 bug 标签
            const hasBugLabel = issue.labels.some(label =>
              label.name === '错误 bug' || label.name === 'bug' || label.name === '错误'
            );

            if (!hasBugLabel) {
              console.log('This issue does not have a bug label. Skipping version check.');
              return;
            }

            async function rejectIssue(body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [INVALID_FORMAT_LABEL]
              });
            }

            const issueBody = issue.body;
            if (!issueBody) {
              console.log('Issue body is empty. Closing issue due to invalid format.');
              await rejectIssue(`## 温馨提示：缺少版本信息 / Friendly Notice: Missing Version Information\n\n感谢您向我们提交问题报告！不过我们注意到您的报告中似乎缺少 GTO 包版本信息。这些信息对我们解决问题非常重要。\n\n**版本格式:** ${formattedVersionExamples}\n\n为了更好地为您服务，我们建议您使用官方模板，并填写完整的游戏内版本信息。当您更新报告后，系统将自动重新打开此问题，我们的团队将尽快处理您的反馈。\n\n感谢您的理解与支持！\n\n---\n\nThank you for submitting your report! However, we noticed that the GTO pack version information appears to be missing from your report. This information is crucial for us to effectively address your concerns.\n\n**Version format:** ${formattedVersionExamples}\n\nTo better assist you, we suggest using the official template and providing the complete in-game version information. Once you update your report, the system will automatically reopen this issue, and our team will address your feedback as soon as possible.\n\nWe appreciate your understanding and support!`);
              return;
            }

            // 从 issue 正文中提取版本字段
            const versionSectionRegex = /###\s*GTO Pack Version\s*\/\s*GTO ?包版本\s*\r?\n+([\s\S]*?)(?=\r?\n###\s|$)/i;
            const versionSectionMatch = issueBody.match(versionSectionRegex);
            let reportedVersion = null;

            if (versionSectionMatch) {
              let versionFieldValue = versionSectionMatch[1]
                .split(/\r?\n/)
                .map(line => line.trim())
                .find(line => line && line !== '_No response_');

              if (versionFieldValue) {
                versionFieldValue = versionFieldValue.replace(/^`([^`]+)`$/, '$1').trim();
                if (REQUIRED_VERSION_REGEX.test(versionFieldValue)) {
                  reportedVersion = versionFieldValue;
                }
              }
            }

            if (!reportedVersion) {
              console.log('Could not extract a valid version from issue body.');
              await rejectIssue(`## 温馨提示：版本信息格式问题 / Friendly Notice: Version Format Issue\n\n感谢您向我们提交问题报告！我们非常重视您的反馈，但系统未能从您的描述中识别出有效的 GTO 包版本信息。\n\n请填写游戏窗口左上角标题栏中，GregTech Odyssey 后面显示的完整版本号。\n\n**版本格式:** ${formattedVersionExamples}\n\n为了让我们能更好地解决您遇到的问题，烦请您使用最新版本的官方模板，并确保版本号格式正确。当您更新报告后，系统将自动重新打开此问题。\n\n感谢您的配合与耐心！\n\n---\n\nThank you for your bug report! We highly value your feedback, but our system couldn't identify a valid GTO pack version from your description.\n\nPlease provide the full version shown after GregTech Odyssey in the game window title bar.\n\n**Version format:** ${formattedVersionExamples}\n\nTo help us better address your issue, please use the official template from the latest version and ensure the version number is in the correct format. Once you update your report, the system will automatically reopen this issue.\n\nThank you for your cooperation and patience!`);
              return;
            }

            console.log(`Reported version: ${reportedVersion}. Format is valid.`);

            // 版本格式正确：移除之前的格式无效/版本过时标签，并重新打开 issue
            const hasOutdatedLabel = issue.labels.some(label => label.name === OUTDATED_LABEL);
            const hasInvalidFormatLabel = issue.labels.some(label => label.name === INVALID_FORMAT_LABEL);

            for (const [present, name] of [[hasOutdatedLabel, OUTDATED_LABEL], [hasInvalidFormatLabel, INVALID_FORMAT_LABEL]]) {
              if (present) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name
                }).catch(e => console.log(`Error removing ${name} label:`, e.message));
              }
            }

            if (issue.state === 'closed' && (hasOutdatedLabel || hasInvalidFormatLabel)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'open'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `## 版本验证通过，问题已重新打开 / Version Verified, Issue Reopened\n\n非常感谢您更新了问题报告！您填写的版本 (\`${reportedVersion}\`) 格式正确，我们已自动重新打开这个问题。我们的团队将尽快查看并处理您的反馈。\n\n感谢您对 GTO 项目的支持与贡献！\n\n---\n\nThank you for updating your report! The version you provided (\`${reportedVersion}\`) is in a valid format, and we've automatically reopened this issue. Our team will review and address your feedback as soon as possible.\n\nWe appreciate your support and contributions to the GTO project!`
              });
            }

            // 折叠之前的机器人警告信息
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            });

            const botComments = comments.filter(comment =>
              comment.user.type === 'Bot' &&
              !comment.body.startsWith('<details>') &&
              (comment.body.includes('温馨提示：版本信息格式问题') ||
               comment.body.includes('温馨提示：缺少版本信息') ||
               comment.body.includes('温馨提示：版本需要更新'))
            );

            for (const comment of botComments) {
              const processedLines = comment.body.split('\n').map(line => {
                if (line.trim() === '') return '';
                return `~~${line}~~`;
              }).join('\n');

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
                body: `<details>\n<summary><b>已解决的版本问题 (点击展开) / Resolved Version Issue (Click to expand)</b></summary>\n\n${processedLines}\n</details>`
              });
            }
